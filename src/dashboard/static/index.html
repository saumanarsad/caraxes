<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ReplayLab</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:          #0d1117;
      --surface:     #161b22;
      --surface-2:   #1c2128;
      --border:      #30363d;
      --text:        #e6edf3;
      --text-muted:  #8b949e;
      --accent:      #58a6ff;
      --green:       #3fb950;
      --yellow:      #d29922;
      --red:         #f85149;
      --orange:      #d18616;
      --purple:      #bc8cff;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      font-size: 14px;
      line-height: 1.5;
    }

    /* ── Header ── */
    .header {
      border-bottom: 1px solid var(--border);
      padding: 14px 24px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .header-logo {
      font-size: 17px;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -0.3px;
    }
    .header-logo span { color: var(--accent); }
    .header-sub {
      color: var(--text-muted);
      font-size: 13px;
    }

    /* ── Layout ── */
    .container {
      max-width: 1000px;
      margin: 0 auto;
      padding: 28px 24px;
    }

    #list-view, #detail-view { display: none; }
    #list-view.active, #detail-view.active { display: block; }

    /* ── List toolbar ── */
    .list-toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    .list-title {
      font-size: 15px;
      font-weight: 600;
    }
    .case-count { color: var(--text-muted); font-weight: 400; }

    .refresh-btn {
      background: none;
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 5px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      transition: color 0.15s, border-color 0.15s;
    }
    .refresh-btn:hover { color: var(--text); border-color: var(--text-muted); }

    /* ── Table ── */
    .table-wrap {
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
    }
    table {
      width: 100%;
      border-collapse: collapse;
    }
    thead { background: var(--surface); }
    th {
      text-align: left;
      padding: 9px 16px;
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      border-bottom: 1px solid var(--border);
    }
    tbody tr {
      cursor: pointer;
      transition: background 0.1s;
    }
    tbody tr:not(:last-child) td { border-bottom: 1px solid var(--border); }
    tbody tr:hover { background: var(--surface); }
    td { padding: 11px 16px; vertical-align: middle; }

    .td-url {
      font-family: 'SFMono-Regular', Consolas, monospace;
      font-size: 13px;
      max-width: 400px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      display: block;
    }
    .td-time { color: var(--text-muted); font-size: 13px; white-space: nowrap; }

    /* ── Method badge ── */
    .badge {
      display: inline-block;
      padding: 2px 7px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 700;
      font-family: 'SFMono-Regular', Consolas, monospace;
      letter-spacing: 0.3px;
    }
    .badge-get    { background: rgba(63,185,80,.15);  color: #3fb950; }
    .badge-post   { background: rgba(88,166,255,.15); color: #58a6ff; }
    .badge-put    { background: rgba(210,153,34,.15); color: #d29922; }
    .badge-patch  { background: rgba(209,134,22,.15); color: #d18616; }
    .badge-delete { background: rgba(248,81,73,.15);  color: #f85149; }
    .badge-other  { background: rgba(188,140,255,.15);color: #bc8cff; }

    /* ── Status badge ── */
    .status {
      display: inline-block;
      padding: 2px 7px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 600;
      font-family: 'SFMono-Regular', Consolas, monospace;
    }
    .status-2xx { background: rgba(63,185,80,.15);  color: #3fb950; }
    .status-3xx { background: rgba(88,166,255,.15); color: #58a6ff; }
    .status-4xx { background: rgba(210,153,34,.15); color: #d29922; }
    .status-5xx { background: rgba(248,81,73,.15);  color: #f85149; }
    .status-unk { background: rgba(139,148,158,.15);color: #8b949e; }

    /* ── Empty / loading ── */
    .empty, .loading {
      text-align: center;
      padding: 56px 24px;
      color: var(--text-muted);
    }
    .empty-title { font-size: 15px; font-weight: 600; margin-bottom: 6px; color: var(--text); }
    .empty-sub   { font-size: 13px; }

    /* ── Detail view ── */
    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--accent);
      background: none;
      border: none;
      cursor: pointer;
      font-size: 14px;
      padding: 0;
      margin-bottom: 24px;
    }
    .back-btn:hover { text-decoration: underline; }

    .detail-meta {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 6px;
    }
    .detail-url {
      font-family: 'SFMono-Regular', Consolas, monospace;
      font-size: 16px;
      font-weight: 600;
      word-break: break-all;
    }
    .detail-sub {
      color: var(--text-muted);
      font-size: 13px;
      margin-bottom: 22px;
    }

    /* ── Curl button ── */
    .curl-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 28px;
      transition: background 0.15s, border-color 0.15s, color 0.15s;
    }
    .curl-btn:hover { background: var(--surface-2); border-color: var(--accent); color: var(--accent); }
    .curl-btn.copied { border-color: var(--green); color: var(--green); }

    /* ── Sections ── */
    .section {
      margin-bottom: 16px;
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
    }
    .section-label {
      background: var(--surface);
      padding: 9px 16px;
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      border-bottom: 1px solid var(--border);
    }
    .section-body { padding: 14px 16px; }

    pre {
      font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', monospace;
      font-size: 12px;
      line-height: 1.65;
      color: var(--text);
      white-space: pre-wrap;
      word-break: break-word;
      margin: 0;
    }
    pre.error-pre { color: var(--red); }

    /* ── Headers table ── */
    .headers-table { width: 100%; border-collapse: collapse; }
    .headers-table tr:not(:last-child) td { border-bottom: 1px solid var(--border); }
    .headers-table td {
      padding: 6px 8px;
      font-family: 'SFMono-Regular', Consolas, monospace;
      font-size: 12px;
      vertical-align: top;
    }
    .hdr-key { color: var(--text-muted); white-space: nowrap; padding-right: 20px; width: 1%; }
    .hdr-val { color: var(--text); word-break: break-word; }

    .null-state { color: var(--text-muted); font-style: italic; font-size: 13px; }
  </style>
</head>
<body>

<header class="header">
  <div class="header-logo">Replay<span>Lab</span></div>
  <div class="header-sub">HTTP request capture &amp; replay</div>
</header>

<div class="container">

  <!-- List View -->
  <div id="list-view">
    <div class="list-toolbar">
      <div class="list-title">Captured Cases <span class="case-count" id="case-count"></span></div>
      <button class="refresh-btn" onclick="loadCases()">Refresh</button>
    </div>
    <div id="list-content"></div>
  </div>

  <!-- Detail View -->
  <div id="detail-view">
    <button class="back-btn" onclick="showList()">&#8592; Back to cases</button>
    <div id="detail-content"></div>
  </div>

</div>

<script>
  const API = '/replaylab/api';
  let cases = [];

  /* ── Helpers ── */

  function methodBadge(method) {
    const m = (method || 'GET').toUpperCase();
    const cls = { GET: 'get', POST: 'post', PUT: 'put', PATCH: 'patch', DELETE: 'delete' }[m] || 'other';
    return `<span class="badge badge-${cls}">${m}</span>`;
  }

  function statusBadge(code) {
    const n = Number(code);
    let cls = 'unk';
    if (n >= 200 && n < 300) cls = '2xx';
    else if (n >= 300 && n < 400) cls = '3xx';
    else if (n >= 400 && n < 500) cls = '4xx';
    else if (n >= 500)            cls = '5xx';
    return `<span class="status status-${cls}">${code}</span>`;
  }

  function relativeTime(iso) {
    const s = Math.floor((Date.now() - new Date(iso).getTime()) / 1000);
    if (s < 60)          return `${s}s ago`;
    if (s < 3600)        return `${Math.floor(s / 60)}m ago`;
    if (s < 86400)       return `${Math.floor(s / 3600)}h ago`;
    return `${Math.floor(s / 86400)}d ago`;
  }

  function absoluteTime(iso) {
    return new Date(iso).toLocaleString(undefined, {
      month: 'short', day: 'numeric',
      hour: '2-digit', minute: '2-digit', second: '2-digit',
    });
  }

  function formatJson(val) {
    if (val === null || val === undefined) return null;
    if (typeof val === 'string') return val;
    return JSON.stringify(val, null, 2);
  }

  function esc(s) {
    return String(s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  /* ── List ── */

  async function loadCases() {
    const el = document.getElementById('list-content');
    el.innerHTML = '<div class="loading">Loading&hellip;</div>';
    try {
      const res = await fetch(`${API}/cases`);
      cases = await res.json();
    } catch {
      el.innerHTML = `<div class="table-wrap"><div class="empty">
        <div class="empty-title">Could not reach the server</div>
        <div class="empty-sub">Make sure ReplayLab is registered and the app is running.</div>
      </div></div>`;
      return;
    }
    renderList();
  }

  function renderList() {
    const el = document.getElementById('list-content');
    const countEl = document.getElementById('case-count');
    countEl.textContent = cases.length ? `(${cases.length})` : '';

    if (!cases.length) {
      el.innerHTML = `<div class="table-wrap"><div class="empty">
        <div class="empty-title">No cases yet</div>
        <div class="empty-sub">Trigger a request to your app and it will appear here.</div>
      </div></div>`;
      return;
    }

    const rows = cases.slice().reverse().map(c => `
      <tr onclick="showDetail('${esc(c.id)}')">
        <td>${methodBadge(c.method)}</td>
        <td><span class="td-url">${esc(c.url)}</span></td>
        <td>${statusBadge(c.responseStatus)}</td>
        <td class="td-time" title="${esc(absoluteTime(c.capturedAt))}">${relativeTime(c.capturedAt)}</td>
      </tr>`).join('');

    el.innerHTML = `<div class="table-wrap"><table>
      <thead><tr>
        <th>Method</th><th>URL</th><th>Status</th><th>Captured</th>
      </tr></thead>
      <tbody>${rows}</tbody>
    </table></div>`;
  }

  /* ── Detail ── */

  function showDetail(id) {
    const c = cases.find(x => x.id === id);
    if (!c) return;

    document.getElementById('list-view').classList.remove('active');
    document.getElementById('detail-view').classList.add('active');

    const headersRows = Object.entries(c.headers || {}).map(([k, v]) =>
      `<tr><td class="hdr-key">${esc(k)}</td><td class="hdr-val">${esc(v)}</td></tr>`
    ).join('');

    const reqBody = formatJson(c.body);
    const resBody = formatJson(c.responseBody);

    const COPY_ICON = `<svg width="13" height="13" viewBox="0 0 16 16" fill="currentColor">
      <path d="M0 6.75C0 5.784.784 5 1.75 5h1.5a.75.75 0 0 1 0 1.5h-1.5a.25.25 0 0 0-.25.25v7.5c0 .138.112.25.25.25h7.5a.25.25 0 0 0 .25-.25v-1.5a.75.75 0 0 1 1.5 0v1.5A1.75 1.75 0 0 1 9.25 16h-7.5A1.75 1.75 0 0 1 0 14.25Z"/>
      <path d="M5 1.75C5 .784 5.784 0 6.75 0h7.5C15.216 0 16 .784 16 1.75v7.5A1.75 1.75 0 0 1 14.25 11h-7.5A1.75 1.75 0 0 1 5 9.25Zm1.75-.25a.25.25 0 0 0-.25.25v7.5c0 .138.112.25.25.25h7.5a.25.25 0 0 0 .25-.25v-7.5a.25.25 0 0 0-.25-.25Z"/>
    </svg>`;
    const CHECK_ICON = `<svg width="13" height="13" viewBox="0 0 16 16" fill="currentColor">
      <path d="M13.78 4.22a.75.75 0 0 1 0 1.06l-7.25 7.25a.75.75 0 0 1-1.06 0L2.22 9.28a.75.75 0 0 1 1.06-1.06L6 10.94l6.72-6.72a.75.75 0 0 1 1.06 0Z"/>
    </svg>`;

    document.getElementById('detail-content').innerHTML = `
      <div class="detail-meta">
        ${methodBadge(c.method)}
        <span class="detail-url">${esc(c.url)}</span>
        ${statusBadge(c.responseStatus)}
      </div>
      <div class="detail-sub">${c.durationMs}ms &middot; ${absoluteTime(c.capturedAt)}</div>

      <button class="curl-btn" id="curl-btn" onclick="copyCurl('${esc(c.id)}')">
        ${COPY_ICON} Copy curl command
      </button>

      <div class="section">
        <div class="section-label">Request Headers</div>
        <div class="section-body">
          ${headersRows
            ? `<table class="headers-table"><tbody>${headersRows}</tbody></table>`
            : '<span class="null-state">No headers</span>'}
        </div>
      </div>

      <div class="section">
        <div class="section-label">Request Body</div>
        <div class="section-body">
          ${reqBody !== null
            ? `<pre>${esc(reqBody)}</pre>`
            : '<span class="null-state">No body</span>'}
        </div>
      </div>

      <div class="section">
        <div class="section-label">Response Body</div>
        <div class="section-body">
          ${resBody !== null
            ? `<pre>${esc(resBody)}</pre>`
            : '<span class="null-state">No response body</span>'}
        </div>
      </div>

      ${c.error ? `
      <div class="section">
        <div class="section-label">Error</div>
        <div class="section-body"><pre class="error-pre">${esc(c.error)}</pre></div>
      </div>` : ''}
    `;
  }

  function showList() {
    document.getElementById('detail-view').classList.remove('active');
    document.getElementById('list-view').classList.add('active');
  }

  /* ── Copy curl ── */

  async function copyCurl(id) {
    const btn = document.getElementById('curl-btn');
    const CHECK_ICON = `<svg width="13" height="13" viewBox="0 0 16 16" fill="currentColor">
      <path d="M13.78 4.22a.75.75 0 0 1 0 1.06l-7.25 7.25a.75.75 0 0 1-1.06 0L2.22 9.28a.75.75 0 0 1 1.06-1.06L6 10.94l6.72-6.72a.75.75 0 0 1 1.06 0Z"/>
    </svg>`;
    const COPY_ICON = `<svg width="13" height="13" viewBox="0 0 16 16" fill="currentColor">
      <path d="M0 6.75C0 5.784.784 5 1.75 5h1.5a.75.75 0 0 1 0 1.5h-1.5a.25.25 0 0 0-.25.25v7.5c0 .138.112.25.25.25h7.5a.25.25 0 0 0 .25-.25v-1.5a.75.75 0 0 1 1.5 0v1.5A1.75 1.75 0 0 1 9.25 16h-7.5A1.75 1.75 0 0 1 0 14.25Z"/>
      <path d="M5 1.75C5 .784 5.784 0 6.75 0h7.5C15.216 0 16 .784 16 1.75v7.5A1.75 1.75 0 0 1 14.25 11h-7.5A1.75 1.75 0 0 1 5 9.25Zm1.75-.25a.25.25 0 0 0-.25.25v7.5c0 .138.112.25.25.25h7.5a.25.25 0 0 0 .25-.25v-7.5a.25.25 0 0 0-.25-.25Z"/>
    </svg>`;
    try {
      const res = await fetch(`${API}/cases/${id}/curl`);
      const { curl } = await res.json();
      await navigator.clipboard.writeText(curl);
      btn.classList.add('copied');
      btn.innerHTML = `${CHECK_ICON} Copied!`;
      setTimeout(() => {
        btn.classList.remove('copied');
        btn.innerHTML = `${COPY_ICON} Copy curl command`;
      }, 1500);
    } catch {
      btn.textContent = 'Copy failed';
      setTimeout(() => { btn.innerHTML = `${COPY_ICON} Copy curl command`; }, 1500);
    }
  }

  /* ── Init ── */
  document.getElementById('list-view').classList.add('active');
  loadCases();
</script>

</body>
</html>
